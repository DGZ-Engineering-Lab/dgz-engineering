server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  client_max_body_size 10m;

  # Security headers (applied to every response, including errors)
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), payment=()" always;
  add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

  # Never serve dotfiles, env files, VCS metadata or source/data files that live in the repo root
  location ~ /\. {
    deny all;
    return 404;
  }
  location ~* \.(env|py|pyc|ps1|sql|csv|parquet|txt|md|yml|yaml|lock|toml|cfg|ini|sh)$ {
    deny all;
    return 404;
  }
  location = /robots.txt {
    try_files $uri =404;
  }
  location ~ ^/(backend|scratch|geoai|docs|nginx|apps|node_modules)/ {
    deny all;
    return 404;
  }

  location / {
    try_files $uri $uri/ =404;
  }

  # Proxy API calls to the FastAPI service running on port 8000
  location /api/ {
    proxy_pass http://api:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
