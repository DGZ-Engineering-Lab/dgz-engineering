# Dependabot version updates
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Kept quiet on purpose: one grouped PR per ecosystem per month, at most one
# open at a time. Security updates are not affected by this schedule and
# still arrive as soon as an advisory is published.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "CI/CD"
      - "dependencies"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      web:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/backend/fastapi"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      fastapi:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      api:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/backend/qa_engine"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      qa-engine:
        patterns: ["*"]

  - package-ecosystem: "docker"
    directory: "/backend/fastapi"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
