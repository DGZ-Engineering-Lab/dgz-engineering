version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "CI/CD"
      - "dependencies"

  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      # Batch routine minor/patch bumps into one PR to keep noise low.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "pip"
    directories:
      - "/apps/api"
      - "/backend/fastapi"
      - "/backend/qa_engine"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
