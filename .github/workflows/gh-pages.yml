name: DGZ Vision CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Mínimo privilegio: solo el job de despliegue recibe permisos de escritura en Pages.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Validation Job
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax Check (Basic HTML validation)
        run: |
          find . -name "*.html" -exec tidy -e {} + || echo "Minor warnings found, but proceeding."
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/qa_engine/requirements.txt'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/qa_engine/requirements.txt
          pip install pytest
      - name: Run unit tests
        working-directory: backend/qa_engine
        run: |
          pytest test_core_validator.py


  # Deployment Job
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Assemble redirect site
        # The production site is the Next.js app on Vercel. GitHub Pages only serves
        # redirect stubs (meta refresh + canonical) so the legacy URLs consolidate there
        # instead of competing in search results as duplicate content.
        env:
          TARGET: https://devgiz.vercel.app
        run: |
          mkdir _site
          stub() {
            mkdir -p "_site/$(dirname "$1")"
            cat > "_site/$1" <<EOF
          <!DOCTYPE html>
          <html lang="es-CO"><head><meta charset="utf-8">
          <title>DevGiz se ha mudado</title>
          <link rel="canonical" href="$TARGET$2">
          <meta http-equiv="refresh" content="0; url=$TARGET$2">
          </head><body><p>Esta página se movió a <a href="$TARGET$2">$TARGET$2</a>.</p></body></html>
          EOF
          }
          stub index.html /
          stub 404.html /
          stub lab/gesture_sandbox.html /lab/gesture-sandbox
          stub lab/map.html /projects
          stub lab/validator.html /projects/qgis-plugin
          stub lab/geoai.html /projects/geo-llm
          stub lab/colombia_biomatrix.html /projects
          stub projects/index.html /projects
          stub projects/qgis-plugin/index.html /projects/qgis-plugin
          stub projects/automation-systems/index.html /projects/automation-systems
          stub projects/geo-llm/index.html /projects/geo-llm
          stub projects/gis-dashboard/index.html /projects
          stub projects/research/index.html /blog
          printf 'User-agent: *\nAllow: /\nSitemap: %s/sitemap.xml\n' "$TARGET" > _site/robots.txt
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
